<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Sederhana</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
    }

    .calculator {
      width: 300px;
      background: #111;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(0, 100, 255, 0.15),
                  0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #1a1a2e;
    }

    .display {
      background: #0a0a0a;
      color: #e0e7ff;
      font-size: 2.5rem;
      text-align: right;
      padding: 18px 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      min-height: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid #1e3a5f;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 500;
      height: 60px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #e0e7ff;
      user-select: none;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-num {
      background: #1a1a2e;
    }
    .btn-num:hover {
      background: #252545;
    }

    .btn-op {
      background: #1e3a5f;
      color: #60a5fa;
    }
    .btn-op:hover {
      background: #2563eb;
      color: #fff;
    }

    .btn-clear {
      background: #1e3a5f;
      color: #93c5fd;
    }
    .btn-clear:hover {
      background: #1e40af;
      color: #fff;
    }

    .btn-eq {
      background: #2563eb;
      color: #fff;
    }
    .btn-eq:hover {
      background: #3b82f6;
    }

    .btn-zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn-op" onclick="append('/')">/</button>
      <button class="btn-op" onclick="append('*')">×</button>
      <button class="btn-op" onclick="append('-')">−</button>

      <button class="btn-num" onclick="append('7')">7</button>
      <button class="btn-num" onclick="append('8')">8</button>
      <button class="btn-num" onclick="append('9')">9</button>
      <button class="btn-op" onclick="append('+')">+</button>

      <button class="btn-num" onclick="append('4')">4</button>
      <button class="btn-num" onclick="append('5')">5</button>
      <button class="btn-num" onclick="append('6')">6</button>
      <button class="btn-eq" onclick="calculate()">=</button>

      <button class="btn-num" onclick="append('1')">1</button>
      <button class="btn-num" onclick="append('2')">2</button>
      <button class="btn-num" onclick="append('3')">3</button>
      <button class="btn-num" onclick="append('.')">.</button>

      <button class="btn-num btn-zero" onclick="append('0')">0</button>
      <button class="btn-clear" onclick="backspace()">⌫</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let current = '0';
    let resetNext = false;

    function updateDisplay() {
      display.textContent = current;
    }

    function append(val) {
      if (resetNext) {
        current = '0';
        resetNext = false;
      }

      if (val === '.' && current.includes('.')) return;

      if (current === '0' && val !== '.' && !isOperator(val)) {
        current = val;
      } else {
        current += val;
      }
      updateDisplay();
    }

    function isOperator(val) {
      return ['+', '-', '*', '/'].includes(val);
    }

    function clearDisplay() {
      current = '0';
      resetNext = false;
      updateDisplay();
    }

    function backspace() {
      if (resetNext) {
        clearDisplay();
        return;
      }
      current = current.slice(0, -1) || '0';
      updateDisplay();
    }

    function calculate() {
      try {
        let expr = current.replace(/×/g, '*').replace(/−/g, '-');
        let result = Function('"use strict"; return (' + expr + ')')();
        
        if (!isFinite(result)) {
          current = 'Error';
        } else {
          current = String(Math.round(result * 1e12) / 1e12);
        }
      } catch (e) {
        current = 'Error';
      }
      resetNext = true;
      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') append(e.key);
      else if (e.key === '.') append('.');
      else if (e.key === '+') append('+');
      else if (e.key === '-') append('-');
      else if (e.key === '*') append('*');
      else if (e.key === '/') append('/');
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') clearDisplay();
      else if (e.key === 'Backspace') backspace();
    });
  </script>
</body>
</html>
